# Tell: a privacy leak scanner for Midnight Compact contracts.
# Copyright (C) 2026 Rohan Borade
# SPDX-License-Identifier: Apache-2.0
name: 'Tell: Midnight privacy leak scanner'
description: 'Find what your Compact contracts reveal: guessable hashes, secret branches, linkable tags, keys in the clear.'
branding:
  icon: 'eye'
  color: 'purple'

inputs:
  path:
    description: 'Directories or files holding your .compact contracts (space-separated)'
    required: false
    default: '.'
  fail-on:
    description: 'Fail the job at this severity or worse: critical, high, medium, low, info, or none'
    required: false
    default: 'high'
  compact-version:
    description: 'Compact toolchain to install (the one for the ledger live today by default)'
    required: false
    default: '0.31.1'
  upload-sarif:
    description: 'Upload findings to GitHub code scanning (needs security-events: write)'
    required: false
    default: 'true'
  comment:
    description: 'On pull requests, post review comments on the changed lines of .compact files (needs pull-requests: write)'
    required: false
    default: 'true'
  suggest-fixes:
    description: 'Work out verified fixes (compiled and re-scanned) and offer them as suggestions in comments and the job summary'
    required: false
    default: 'true'
  comment-on:
    description: 'Lowest severity that gets an inline comment: critical, high, medium or low'
    required: false
    default: 'medium'
  policy:
    description: 'A Tell policy file (declared intent: secret and public inputs, one-time circuits, intended disclosures). Default: the nearest tell.json or .tellrc.json above each contract; "none" ignores policy files'
    required: false
    default: ''
  github-token:
    description: 'Token used to post pull request comments'
    required: false
    default: ${{ github.token }}

outputs:
  sarif:
    description: 'Path of the SARIF file written'
    value: ${{ steps.scan.outputs.sarif }}
  results:
    description: 'Path of the JSON results (with verified fixes when suggest-fixes is on)'
    value: ${{ steps.scan.outputs.results }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: midnightntwrk/setup-compact-action@v1
      with:
        compact-version: ${{ inputs.compact-version }}
    - name: Install Tell
      shell: bash
      run: |
        cd "${{ github.action_path }}"
        npm install --no-audit --no-fund --workspace engine --include-workspace-root=false >/dev/null
    - id: scan
      name: Scan
      shell: bash
      env:
        TELL_SUGGEST: ${{ inputs.suggest-fixes }}
        TELL_POLICY: ${{ inputs.policy }}
      run: |
        out="$RUNNER_TEMP/tell.sarif"
        json="$RUNNER_TEMP/tell.json"
        fail="${{ inputs.fail-on }}"
        args=(--sarif "$out" --json-out "$json")
        if [ "$fail" != "none" ]; then args+=(--fail-on "$fail"); fi
        if [ "$TELL_SUGGEST" = "true" ]; then args+=(--fix-dry-run); fi
        if [ "$TELL_POLICY" = "none" ]; then args+=(--no-policy); elif [ -n "$TELL_POLICY" ]; then args+=(--policy "$TELL_POLICY"); fi
        set +e
        read -r -a paths <<< "${{ inputs.path }}"
        npx --prefix "${{ github.action_path }}/engine" tsx "${{ github.action_path }}/engine/src/cli.ts" "${paths[@]}" "${args[@]}"
        code=$?
        set -e
        echo "sarif=$out" >> "$GITHUB_OUTPUT"
        if [ -f "$json" ]; then echo "results=$json" >> "$GITHUB_OUTPUT"; fi
        echo "code=$code" >> "$GITHUB_OUTPUT"
    - name: Review
      # Job summary always; inline comments on pull requests. Never fails the job by itself.
      if: ${{ always() && steps.scan.outputs.results != '' }}
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        TELL_COMMENT: ${{ inputs.comment }}
        TELL_SUGGEST: ${{ inputs.suggest-fixes }}
        TELL_POLICY: ${{ inputs.policy }}
        TELL_COMMENT_ON: ${{ inputs.comment-on }}
        TELL_RESULTS: ${{ steps.scan.outputs.results }}
      run: |
        npx --prefix "${{ github.action_path }}/engine" tsx "${{ github.action_path }}/engine/src/action.ts" --results "$TELL_RESULTS" \
          || echo "::warning title=Tell::the review step failed; the scan result stands"
    - if: ${{ inputs.upload-sarif == 'true' && always() }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ steps.scan.outputs.sarif }}
        category: tell
    - name: Result
      shell: bash
      run: exit ${{ steps.scan.outputs.code }}
