# TEMPORARY (removed before merge): the tell-pr-demo job's steps on push to ci-hardening, with the
# leaky ballot from demo/hash-the-vote (pull request #1), to check the gate goes green when Tell
# catches the leak and red when it misses it, without opening a pull request.
name: tell-pr-demo-check
on:
  push:
    branches: [ci-hardening]
permissions:
  contents: read
jobs:
  caught:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The pull request's ballot
        run: git fetch -q origin demo/hash-the-vote && git checkout FETCH_HEAD -- demo/ballot.compact && git diff --cached --stat
      - name: Tell reviews the change (expected to fail on the demo leak)
        id: tell
        uses: ./
        continue-on-error: true
        with:
          path: demo
          fail-on: high
          comment: 'true'
          suggest-fixes: 'true'
          comment-on: medium
          upload-sarif: 'false'
      - name: Tell caught the leak, as intended
        if: steps.tell.outcome == 'failure'
        env:
          RESULTS: ${{ steps.tell.outputs.results }}
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync(process.env.RESULTS, "utf8"));
            const hits = r.flatMap((c) => (c.ok ? c.report.findings : []).filter((f) => !f.suppressed && ["critical", "high"].includes(f.severity)).map((f) => `${c.file}:${f.line ?? "?"} ${f.severity} ${f.title}`));
            const broken = r.filter((c) => !c.ok).map((c) => c.file);
            if (broken.length) { console.log("::error title=Tell::did not compile: " + broken.join(", ")); process.exit(1); }
            if (!hits.length) { console.log("::error title=Tell::the scan failed without a high or critical finding"); process.exit(1); }
            console.log("Tell caught the leak, as intended:\n  " + hits.join("\n  "));
          '
      - name: Tell missed the leak
        if: steps.tell.outcome != 'failure'
        run: echo "::error title=Tell::the demo change leaks, and Tell did not fail at high" && exit 1
  missed:
    # main's ballot does not leak at high: the same gate must go red (this job is expected to fail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tell reviews main's ballot
        id: tell
        uses: ./
        continue-on-error: true
        with:
          path: demo
          fail-on: high
          comment: 'false'
          suggest-fixes: 'false'
          upload-sarif: 'false'
      - name: Tell missed the leak
        if: steps.tell.outcome != 'failure'
        run: echo "::error title=Tell::the demo change leaks, and Tell did not fail at high" && exit 1
